name: CI Workflow
on:
  push:
    branches: [ main, dev, feat/* ]
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: [ ubuntu-latest ]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
      redis:
        image: redis:latest
        ports:
          - 6379:6379

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: java setup
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: make executable gradlew
        run: chmod +x ./gradlew

      - name: run unittest
        env:
          POSTGRES_URL: jdbc:postgresql://localhost:5432/testdb
          POSTGRES_USERNAME: user
          POSTGRES_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          ./gradlew clean test